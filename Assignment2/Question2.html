<!DOCTYPE html>
<html>
<head>
    <title>Table Layout</title>
</head>
<body>

<table border="1" width="600">


    <tr>
        <td colspan="4" align="center"><h2>A</h2></td>
    </tr>

   
    <tr>
        <td colspan="2" rowspan="2" align="center"><h2>B</h2></td>
        <td colspan="2" align="center"><h2>C</h2></td>
    </tr>


    <tr>
        <td align="center"><h2>D</h2></td>
        <td align="center"><h2>E</h2></td>
    </tr>

   
    <tr>
        <td rowspan="3" align="center"><h2>F</h2></td>
        <td colspan="3" align="center"><h2>G</h2></td>
    </tr>

    <tr>
        <td align="center"><h2>H</h2></td>
        <td align="center"><h2>I</h2></td>
        <td rowspan="2" align="center"><h2>J</h2></td>
    </tr>


    <tr>
        <td colspan="2" align="center"><h2>K</h2></td>
    </tr>


    <tr>
        <td colspan="3" rowspan="2" align="center"><h2>L</h2></td>
        <td align="center"><h2>M</h2></td>
    </tr>

    
    <tr>
        <td align="center"><h2>N</h2></td>
    </tr>

</table>

</body>
</html>
