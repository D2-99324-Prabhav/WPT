<!DOCTYPE html>
<html>
<head>
    <title>Sunbeam Registration Form</title>
</head>
<body>


<table align="center">
    <tr>
        <td>
            <img src="https://mywebsite1.sunbeaminfo.com/img/new/sunbeamnewactslogo.png"
                 alt="Sunbeam Logo" height="80">
        </td>
    </tr>
</table>

<h2 align="center">Sunbeam Registration Form</h2>

<form>
<table align="center" border="0">
    <tr>
         <td rowspan="9" valign="top">
       
         <iframe width="560" height="315" src="https://www.youtube.com/embed/Az5Bt3zUtiM?si=J7fI9RF0bThKjbHI" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <td rowspan="9" valign="top">
      
        </td>

        
        <td><b>Name:</b></td>
        <td><input type="text" name="name" required></td>
    </tr>
    <tr>
        
        <td><b>BirthDate:</b></td>
        <td><input type="date" name="dob" required></td>
    </tr>
    <tr>
        
        <td><b>Email:</b></td>
        <td><input type="email" name="email" required></td>
    </tr>
    <tr>
        
        <td><b>Password:</b></td>
        <td><input type="password" name="password" required></td>
    </tr>
    <tr>

        <td valign="top"><b>Address:</b></td>
        <td>
            <textarea name="address" rows="5" cols="30">Sunbeam Institute of IT
'Anuda Chambers', 203
Shaniwar Peth, Near
Gujar Hospital, Karad-
415110 (Maharashtra)</textarea>
        </td>
    </tr>
    <tr>

        <td><b>Gender:</b></td>
        <td>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
        </td>
    </tr>
    <tr>

        <td><b>Upload Photo:</b></td>
        <td><input type="file" name="photo"></td>
    </tr>
    <tr>

        <td><b>Select your Course:</b></td>
        <td>
            <select name="course">
                <option value="">Select course</option>
                <option value="dac">DAC</option>
                <option value="dbda">DBDA</option>
                <option value="dece">DECE</option>
                <option value="dacoc">DAC+OC</option>
            </select>
        </td>
    </tr>
    <tr>

        <td valign="top"><b>Skill Set:</b></td>
        <td>
            <input type="checkbox" name="skill" value="java"> Java
            <input type="checkbox" name="skill" value="cpp"> CPP
            <input type="checkbox" name="skill" value="os"> OS
            <br>
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </td>
    </tr>
</table>
</form>

</body>
</html>
